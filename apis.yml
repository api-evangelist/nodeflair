name: NodeFlair
description: NodeFlair is a Singapore-based technology career-transparency platform,
  founded in 2018 by Ethan Ang, that gives Asia's tech talent access to verified salary
  data, company reviews, tech-stack insights, benefits, and job listings across the
  APAC region. Salaries are verified against actual employee payslips, differentiating
  NodeFlair from other job boards, and the platform serves over 500,000 monthly visitors
  across eight Asian countries while helping companies hire tech talent. It was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network. No
  public developer API surface was found during enrichment; the profile currently
  carries live domain-security posture only.
